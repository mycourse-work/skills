name: Validator tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validator tests, stdlib only
        run: python -m unittest discover -s course-validator/tests -v
      - name: Install jsonschema
        run: python -m pip install --quiet "jsonschema>=4.18"
      - name: Schemas are valid draft 2020-12
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for path in sorted(pathlib.Path("schema").glob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print("ok", path)
          PY
      - name: Validator tests with schema agreement
        run: python -m unittest discover -s course-validator/tests -v
      - name: Script version matches the schema $id tag
        run: |
          python - <<'PY'
          import json, pathlib, re
          version = re.search(r'^VERSION = "([^"]+)"', pathlib.Path("course-validator/scripts/validate_course.py").read_text(), re.M).group(1)
          for path in sorted(pathlib.Path("schema").glob("*.schema.json")):
              schema_id = json.loads(path.read_text())["$id"]
              assert f"/v{version}/" in schema_id, (path, schema_id, version)
          print("version", version)
          PY
